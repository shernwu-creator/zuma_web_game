<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08130c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="祖瑪：叢林探險 — 以 Phaser 3 打造的 Zuma 風格彈珠射擊遊戲原型。同色三消、引爆炸彈、收集星星。"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>祖瑪：叢林探險 — 同色三消 · 引爆炸彈 · 收集星星</title>
  </head>
  <body>
    <main class="shell">
      <section class="stage" aria-label="Zuma 風格叢林彈珠遊戲原型">
        <div id="game"></div>
      </section>

      <div class="caption" aria-hidden="true">
        <span>叢林探險 · 同色三消 · 引爆炸彈</span>
        <span>點擊開始遊戲 · 消除整條球串</span>
      </div>
    </main>

    <!-- Portrait phones get a rotate-to-landscape hint; it is decorative only
         (pointer-events: none) and hidden on desktop and in landscape. -->
    <div
      id="rotate-hint"
      class="rotate-hint"
      role="status"
      aria-live="polite"
      aria-label="請將手機橫向持有以獲得最佳遊戲體驗"
    >
      <div class="rotate-hint__card">
        <div class="rotate-hint__device" aria-hidden="true">
          <span class="rotate-hint__screen"></span>
        </div>
        <p class="rotate-hint__title">請將手機橫向持有</p>
        <p class="rotate-hint__copy">
          此遊戲以橫向畫面設計，旋轉裝置即可獲得完整視野。
        </p>
      </div>
    </div>

    <noscript>此遊戲需要啟用 JavaScript 才能執行。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
